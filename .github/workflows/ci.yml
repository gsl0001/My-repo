name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Python engine (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff mypy pyyaml
      - run: python -m pytest tests/microstructure -q
      - run: python -m ruff check lowcap_short_system tests
      - run: python -m mypy lowcap_short_system/microstructure

  ui:
    name: UI (vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
