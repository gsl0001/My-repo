[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowcap-short-system"
version = "0.1.0"
description = "Automated intraday low-cap shorting system (TradeZero + Polygon + IBKR borrow + EDGAR)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lowcap_short_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
